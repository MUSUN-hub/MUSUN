<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>SJE PR Edit Pro</title>
    <script src="main.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #1e1e1e;
            color: #e6e6e6;
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
            font-size: 11px;
            user-select: none;
            overflow-x: hidden;
            overflow-y: auto;
            line-height: 1.4;
        }

        /* ── 섹션 ── */
        .section {
            border-bottom: 1px solid #2c2c2c;
        }

        .section-header {
            padding: 9px 12px 5px;
        }

        .section-header span {
            font-size: 10px;
            font-weight: 400;
            color: #8e8e8e;
            letter-spacing: 0.2px;
        }

        /* ── 버튼 레이아웃 ── */
        .btn-row {
            padding: 4px 0 12px;
            display: flex;
            flex-direction: column;
        }


        /* ── 버튼 공통 ── */
        .btn {
            display: block;
            width: calc(100% - 24px);
            margin: 0 12px 6px 12px;
            padding: 0;
            border-radius: 3px;
            -webkit-appearance: none;
            appearance: none;
            border: none;
            outline: none;
            box-shadow: none;
            font-size: 11px;
            font-weight: 400;
            cursor: pointer;
            text-align: center;
            letter-spacing: 0;
            font-family: inherit;
            transition: background-color 0.08s, border-color 0.08s, color 0.08s;
            line-height: 1.4;
        }

        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .btn-inner {
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            width: 100%;
            height: 100%;
            padding: 6px 10px;
        }

        .btn-default .btn-inner {
            background-color: #4b4b4b;
        }

        .btn-primary .btn-inner {
            background-color: #4b4b4b;
        }

        .btn-quiet .btn-inner {
            background-color: #4b4b4b;
        }

        /* ── Adobe 표준 secondary 버튼 ── */
        .btn-default {
            background-color: #4b4b4b;
            color: #ffffff;
            border: 1px solid #5a5a5a;
        }

        .btn-default:hover {
            background: #5a5a5a;
            border-color: #6a6a6a;
        }

        .btn-default:active {
            background: #3d3d3d;
        }

        /* ── Adobe primary ── */
        .btn-primary {
            background-color: #4b4b4b;
            color: #ffffff;
            border: 1px solid #5a5a5a;
        }

        .btn-primary:hover {
            background: #5a5a5a;
            border-color: #6a6a6a;
        }

        .btn-primary:active {
            background: #3d3d3d;
        }

        /* ── outline/quiet 버튼 ── */
        .btn-quiet {
            background-color: #4b4b4b;
            color: #ffffff;
            border: 1px solid #5a5a5a;
        }

        .btn-quiet:hover {
            background: #5a5a5a;
            border-color: #6a6a6a;
            color: #e6e6e6;
        }

        .btn-quiet:active {
            background: #3d3d3d;
        }

        /* ── 앵글 가로 배열 ── */
        .row-flex {
            display: flex;
            gap: 5px;
            margin: 0 12px;
        }

        .row-flex .btn {
            flex: 1;
            width: auto;
            margin: 0;
            padding: 0;
        }

        .row-flex .btn-inner {
            padding: 6px 4px;
        }

        /* ── 입력 행 ── */
        .field-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 0 12px 1px;
        }

        .field-row label {
            font-size: 11px;
            color: #b0b0b0;
            white-space: nowrap;
            font-weight: 400;
        }

        .field-row input[type="number"] {
            width: 56px;
            background: #1e1e1e;
            border: 1px solid #4b4b4b;
            border-radius: 3px;
            color: #e6e6e6;
            font-size: 11px;
            padding: 4px 6px;
            outline: none;
            font-family: inherit;
            -moz-appearance: textfield;
            appearance: textfield;
            transition: border-color 0.08s, background-color 0.08s;
        }

        .field-row input[type="number"]:hover {
            border-color: #6a6a6a;
        }

        .field-row input[type="number"]:focus {
            border-color: #2680eb;
            background: #1e1e1e;
        }

        .field-row input[type="number"]::-webkit-inner-spin-button,
        .field-row input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        /* ── 구분선 ── */
        .divider {
            border: none;
            border-top: 1px solid #2c2c2c;
            margin: 8px 12px;
        }

        /* ── 푸터 ── */
        .footer {
            padding: 6px 12px 8px;
            border-top: 1px solid #141414;
            background: #1a1a1a;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .footer-top {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 5px;
        }

        .footer-bottom {
            display: flex;
            justify-content: space-between;
            gap: 6px;
        }

        .footer-ver {
            font-size: 10px;
            color: #5a5a5a;
            font-weight: 400;
        }

        #license-status {
            font-size: 10px;
            color: #8e8e8e;
            cursor: pointer;
            flex: 1;
        }

        #license-key-btn {
            background: transparent;
            color: #c8c8c8;
            border: 1px solid #4b4b4b;
            border-radius: 3px;
            font-size: 10px;
            font-weight: 400;
            padding: 3px 9px;
            cursor: pointer;
            font-family: inherit;
            flex: 1;
            text-align: center;
            transition: background-color 0.08s, border-color 0.08s, color 0.08s;
        }

        #license-key-btn:hover {
            background: #2c2c2c;
            border-color: #5a5a5a;
            color: #e6e6e6;
        }

        #license-key-btn:active {
            background: #232323;
        }

        #license-inquiry-btn {
            background: transparent;
            color: #c8c8c8;
            border: 1px solid #4b4b4b;
            border-radius: 3px;
            font-size: 10px;
            font-weight: 400;
            padding: 3px 9px;
            cursor: pointer;
            font-family: inherit;
            flex: 1;
            text-align: center;
            transition: background-color 0.08s, border-color 0.08s, color 0.08s;
        }

        #license-inquiry-btn:hover {
            background: #2c2c2c;
            border-color: #5a5a5a;
            color: #e6e6e6;
        }

        #license-inquiry-btn:active {
            background: #232323;
        }

        #license-deactivate-btn {
            background: transparent;
            color: #e05555;
            border: 1px solid #5a2a2a;
            border-radius: 3px;
            font-size: 10px;
            font-weight: 400;
            padding: 3px 9px;
            cursor: pointer;
            font-family: inherit;
            flex: 1;
            text-align: center;
            transition: background-color 0.08s, border-color 0.08s;
        }

        #license-deactivate-btn:hover {
            background: #2c1a1a;
            border-color: #e05555;
        }

        #license-deactivate-btn:active {
            background: #3a1a1a;
        }

        /* ── 탭 바 ── */
        .tab-bar {
            display: flex;
            border-bottom: 1px solid #2c2c2c;
            background: #1a1a1a;
        }

        .tab-btn {
            flex: 1;
            padding: 8px 4px;
            font-size: 11px;
            font-family: inherit;
            color: #7a7a7a;
            background: transparent;
            border: none;
            border-bottom: 2px solid transparent;
            cursor: pointer;
            text-align: center;
            letter-spacing: 0.2px;
            transition: color 0.1s, border-color 0.1s;
        }

        .tab-btn.active {
            color: #e6e6e6;
            border-bottom-color: #9a9a9a;
        }

        .tab-btn:hover:not(.active) {
            color: #aaaaaa;
        }

        /* ── 패널 ── */
        .tab-panel {
            display: none;
        }

        .tab-panel.active {
            display: block;
        }

        /* ── 모달 열림 시 배경 요소 차단 (모달 오버레이 내부 제외) ── */
        body.modal-open .section input,
        body.modal-open .section button,
        body.modal-open .footer button,
        body.modal-open .footer span,
        body.modal-open .footer div[role=button],
        body.modal-open .tab-btn {
            pointer-events: none !important;
            visibility: hidden !important;
        }
    </style>
</head>

<body>

    <!-- 탭 바 -->
    <div class="tab-bar">
        <div class="tab-btn active" id="tab-edit" role="button">Edit Pro</div>
        <div class="tab-btn" id="tab-stack" role="button">Stack Images</div>
    </div>

    <!-- 패널 1: Edit 시 -->
    <div class="tab-panel active" id="panel-edit">

    <!-- 섹션 0: 단축키 제어 (어도비 UXP 단축키 시스템 정상화 후 주석 해제하여 사용)
    <div class="section" style="background:#222;">
        <div class="section-header" style="display:flex; justify-content:space-between; align-items:center;">
            <span>패널 단축키</span>
            <div class="btn btn-quiet" id="shortcut-toggle-btn" role="button" style="width:auto; margin:0; padding:2px 8px; font-size:10px;">
                <span class="btn-inner" id="shortcut-toggle-text" style="padding:2px; color:#aaa;">OFF</span>
            </div>
        </div>
        <div style="padding: 0 12px 10px; font-size:10px; color:#888; line-height:1.6;">
            [ON 상태일 때 패널 안에서 작동]<br>
            <span style="color:#bbb;">F1:</span> 현재 위치 자르기 &nbsp;&nbsp; <span style="color:#bbb;">F2:</span> 슬라이드 마커<br>
            <span style="color:#bbb;">F3:</span> 앵글 정면 &nbsp;&nbsp; <span style="color:#bbb;">F4:</span> 우측 &nbsp;&nbsp; <span style="color:#bbb;">F5:</span> 좌측
        </div>
    </div>
    -->

    <!-- 섹션 1: 자르기 -->
    <div class="section">
        <div class="section-header">
            <span>자르기</span>
        </div>
        <div class="btn-row">
            <div class="btn btn-primary" id="auto-razor-btn" role="button">
                <span class="btn-inner"><span>자막 위치로 자동 자르기</span></span>
            </div>
            <div class="btn btn-default" id="razor-btn" role="button">
                <span class="btn-inner"><span>현재 헤드 위치 자르기</span></span>
            </div>
        </div>
    </div>

    <!-- 섹션 2: 슬라이드 마커 -->
    <div class="section">
        <div class="section-header">
            <span>슬라이드 마커</span>
        </div>
        <div class="btn-row">
            <div class="field-row">
                <label>시작 번호</label>
                <input type="number" id="slide-start-input" value="1" min="1" />
            </div>
            <div class="btn btn-default" id="razor-marker-btn" role="button">
                <span class="btn-inner"><span>[Slide 1]</span></span>
            </div>
            <div class="row-flex">
                <div class="btn btn-quiet" id="angle-front-btn" role="button">
                    <span class="btn-inner"><span>정면</span></span>
                </div>
                <div class="btn btn-quiet" id="angle-right-btn" role="button">
                    <span class="btn-inner"><span>우측</span></span>
                </div>
                <div class="btn btn-quiet" id="angle-left-btn" role="button">
                    <span class="btn-inner"><span>좌측</span></span>
                </div>
            </div>
            <hr class="divider">
            <div class="field-row">
                <label>이미지 번호</label>
                <input type="number" id="img-start-input" value="1" min="1" />
            </div>
            <div class="btn btn-default" id="img-marker-btn" role="button">
                <span class="btn-inner"><span>[#1]</span></span>
            </div>
        </div>
    </div>

    <!-- 섹션 3: 앵글 스위칭 -->
    <div class="section">
        <div class="section-header">
            <span>앵글 스위칭</span>
        </div>
        <div class="btn-row">
            <div class="btn btn-default" id="switch-btn" role="button">
                <span class="btn-inner"><span>앵글 자동 스위칭</span></span>
            </div>
        </div>
    </div>

    <!-- 섹션 4: 이미지 자동 배치 -->
    <div class="section">
        <div class="section-header">
            <span>이미지 자동 배치</span>
        </div>
        <div class="btn-row">
            <div class="field-row">
                <label>시작 V 트랙</label>
                <input type="number" id="img-track-input" value="4" min="1" />
            </div>
            <div class="btn btn-primary" id="image-btn" role="button">
                <span class="btn-inner"><span>이미지 자동 배치</span></span>
            </div>
        </div>
    </div>

    </div><!-- /panel-edit -->

    <!-- 패널 2: Stack Images -->
    <div class="tab-panel" id="panel-stack">

        <!-- 섹션: 이미지 쌓기 -->
        <div class="section">
            <div class="section-header">
                <span>이미지 쌓기</span>
            </div>
            <div class="btn-row">
                <div class="field-row">
                    <label>시작 V 트랙</label>
                    <input type="number" id="stack-track-input" value="1" min="1" />
                </div>
                <div class="btn btn-default" id="stack-btn" role="button">
                    <span class="btn-inner"><span>이미지 쌓기</span></span>
                </div>
            </div>
        </div>

        <!-- 섹션: 음성+이미지 나열 -->
        <div class="section">
            <div class="section-header">
                <span>음성+이미지 나열</span>
            </div>
            <div class="btn-row">
                <div class="btn btn-default" id="arrange-btn" role="button">
                    <span class="btn-inner"><span>음성+이미지 나열</span></span>
                </div>
            </div>
        </div>

        <!-- 섹션: 진단 (임시) -->
        <div class="section" id="section-sel-debug">
            <div class="section-header"><span>선택 API 진단 (임시)</span></div>
            <div class="btn-row">
                <div class="btn btn-default" id="probe-sel-btn" role="button">
                    <span class="btn-inner"><span>선택 API 진단</span></span>
                </div>
            </div>
            <textarea id="sel-debug-log" readonly rows="8" spellcheck="false"
                style="width:calc(100% - 24px);margin:0 12px 8px;background:#141414;border:1px solid #333;border-radius:3px;color:#aaa;font-size:10px;font-family:inherit;padding:6px 8px;resize:vertical;box-sizing:border-box;"></textarea>
        </div>

    </div><!-- /panel-stack -->

    <!-- 섹션 5: 디버그 (disabled)
    <div class="section">
        <div class="section-header"><span>디버그</span></div>
        <div class="btn-row">
            <button class="btn btn-default" id="debug-shape-btn">API 구조 분석</button>
            <button class="btn btn-default" id="debug-bridge-btn">Bridge / Action 분석</button>
        </div>
    </div>
    <textarea id="debug-log" readonly rows="8" spellcheck="false"></textarea>
    -->

    <div class="footer">
        <div class="footer-top">
            <span class="footer-ver">V2.0</span>
            <span id="license-status" title="클릭하여 라이선스 키 입력"></span>
        </div>
        <div class="footer-bottom">
            <div id="license-key-btn" role="button">키 입력</div>
            <div id="license-inquiry-btn" role="button" title="월간/연간 플랜 구매 문의">구매 문의</div>
            <div id="license-deactivate-btn" role="button" title="이 PC의 라이선스를 해제합니다">삭제</div>
        </div>
    </div>

</body>

</html>
